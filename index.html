<style>
:root{
  --bg:#100e13;
  --surface:#18151d;
  --surface-2:#221d2b;
  --border:#2c2736;
  --border-strong:#413a4f;
  --text:#edeaf2;
  --dim:#9c94aa;
  --faint:#686179;
  --accent:#ff5c8a;
  --accent-soft:rgba(255,92,138,.12);
  --accent-border:rgba(255,92,138,.55);
  --ok:#3ddc84;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --stickyH:150px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(1100px 460px at 50% -120px,rgba(255,92,138,.08),transparent 70%);
  background-repeat:no-repeat;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---- brand row (scrolls away) ---- */
.brand{display:flex;align-items:center;gap:14px;padding:26px 20px 14px;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;letter-spacing:.5px;font-weight:700}
.brand .meta{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.brand .meta b{color:var(--accent);font-weight:600}

/* segmented switchers: UI language (.lang) + prompt output language (.seg) */
.lang,.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;flex:none}
.lang button,.seg button{background:transparent;border:0;padding:5px 13px;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--dim);transition:color .15s,background .15s}
.lang button+button,.seg button+button{border-left:1px solid var(--border-strong)}
.lang button:hover,.seg button:hover{color:var(--text)}
.lang button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:#1c0710}
.seg.mini button{padding:4px 10px;font-size:11.5px}

/* ---- sticky control zone ---- */
.stickyzone{position:sticky;top:0;z-index:30;background:rgba(16,14,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.panel{padding:12px 20px 10px}
#output{
  width:100%;resize:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-family:var(--mono);font-size:13.5px;line-height:1.6;padding:12px 14px;
  min-height:64px;max-height:140px;overflow-y:auto;display:block;
}
#output::placeholder{color:var(--faint)}
#output:focus{border-color:var(--border-strong);outline:none}
.toolbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;
  padding:8px 14px;font-size:13.5px;font-weight:600;letter-spacing:.3px;
  transition:border-color .15s,background .15s,color .15s,transform .06s;
  user-select:none;-webkit-user-select:none;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1c0710}
.btn-accent:hover{background:#ff7ba1;border-color:#ff7ba1;color:#1c0710}
.btn.ok{border-color:var(--ok);color:var(--ok);background:transparent}
.btn.ok:hover{border-color:var(--ok);color:var(--ok)}
.btn svg{width:15px;height:15px;flex:none}
.btn.mini{padding:5px 11px;font-size:12px;border-radius:8px;gap:5px}
.btn .emo{font-size:14px;line-height:1}
.spacer{flex:1}
.count{font-family:var(--mono);font-size:12px;color:var(--dim)}
.count b{color:var(--accent);font-weight:600}

/* negative prompt row (collapsible) */
.negrow{display:flex;align-items:stretch;gap:8px;margin-top:10px}
.negrow[hidden]{display:none}
.neglabel{align-self:center;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--faint);flex:none}
#negout{
  flex:1;resize:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;
  color:var(--dim);font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:9px 12px;
  min-height:38px;max-height:120px;display:block;
}
#negout:focus{outline:none;border-color:var(--border-strong);color:var(--text)}

/* ---- category nav (wraps to multiple rows) ---- */
.catnav{display:flex;flex-wrap:wrap;gap:6px;padding:2px 20px 10px}
.navlink{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  background:transparent;border:1px solid var(--border);border-radius:999px;
  color:var(--dim);padding:4px 12px;font-size:12.5px;
  transition:color .15s,border-color .15s;
}
.navlink:hover{color:var(--text);border-color:var(--border-strong)}
.navlink .n{display:none;font-family:var(--mono);font-size:11px;color:var(--accent)}
.navlink.has-sel{color:var(--text);border-color:var(--accent-border)}
.navlink.has-sel .n{display:inline}
.navgroup{
  flex:none;align-self:center;padding:0 3px 0 11px;margin-left:1px;
  border-left:1px solid var(--border);
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1px;
  color:var(--faint);user-select:none;white-space:nowrap;
}

/* ---- sections ---- */
main{padding:6px 20px 80px}
.cat{margin-top:34px;scroll-margin-top:calc(var(--stickyH) + 12px)}
.cat h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:.5px}
.cat h2 .tick{width:4px;height:18px;border-radius:2px;background:var(--accent);flex:none}
.cat h2 .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.cat h2 .selbadge{
  display:none;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:999px;padding:1px 9px;
}
.cat.has-sel h2 .selbadge{display:inline-block}
.cat h2 .pri{font-family:var(--mono);font-size:10px;font-weight:600;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid;cursor:help}
.cat h2 .pri.P0{color:var(--accent);border-color:var(--accent-border);background:var(--accent-soft)}
.cat h2 .pri.P1{color:#e5b567;border-color:rgba(229,181,103,.45);background:rgba(229,181,103,.07)}
.cat h2 .pri.P2{color:var(--dim);border-color:var(--border-strong);background:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px}
.chip{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;
  transition:border-color .12s,background .12s;
}
.chip:hover{border-color:var(--border-strong);background:var(--surface-2)}
.chip .en{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.chip .sub{font-size:11.5px;color:var(--dim);line-height:1.4;overflow-wrap:anywhere}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-border)}
.chip[aria-pressed="true"] .en{color:var(--accent)}
.chip[aria-pressed="true"] .sub{color:#c9a3b3}
body.lang-en .chip .sub{display:none}

footer{border-top:1px solid var(--border)}
footer>div{padding:18px 20px 40px;color:var(--faint);font-size:12px;font-family:var(--mono)}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .brand h1{font-size:18px}
  .brand .meta{display:none}
  .lang{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>

      cover:['Magazine','Auto-pick: hi-quality + cinematic lighting + low angle + looking at viewer + erotic mood'],
      anime:['Anime','Auto-pick: masterpiece + anime style + large eyes + soft light + centered composition'],
      photo:['Photo','Auto-pick: raw photo + studio lighting + 85mm + shallow depth of field'],
    },
    outZh:'中文',outEn:'EN',outBi:'Both',outTitle:'Choose the prompt output language (independent of UI language)',
    neg:'Negative',negTitle:'Show / hide the negative prompt',negReset:'Reset',
  },
};

const $=s=>document.querySelector(s);
const out=$('#output');
const nav=$('#catnav');
const main=$('#main');
const selected=new Set(); // "catIdx:itemIdx"
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const total=DATA.reduce((n,c)=>n+c.items.length,0);

const LANG_KEY='ps-lang';
let lang='zh';
try{const saved=localStorage.getItem(LANG_KEY);if(saved&&I18N[saved])lang=saved;}catch(e){}

const OUT_KEY='ps-outlang',NEG_KEY='ps-neg';
let outLang='en';
try{const s=localStorage.getItem(OUT_KEY);if(s==='zh'||s==='en'||s==='bi')outLang=s;}catch(e){}

const dispName=cat=>lang==='ja'?cat.name:lang==='en'?cat.en:cat.zh;
const subText=it=>lang==='ja'?it[1]:lang==='zh'?it[2]:'';
const tokenText=it=>outLang==='zh'?it[2]:outLang==='bi'?it[0]+' / '+it[2]:it[0];

/* render nav + sections; keep refs for language switching */
const navNames=[],secNames=[],secBadges=[],subs=[],priEls=[],groupEls=[];
let lastG=-1;
DATA.forEach((cat,ci)=>{
  if(cat.g!==lastG){
    lastG=cat.g;
    const sep=document.createElement('span');
    sep.className='navgroup'; sep.dataset.g=cat.g;
    nav.appendChild(sep); groupEls.push(sep);
  }
  const b=document.createElement('button');
  b.type='button'; b.className='navlink'; b.dataset.cat=ci;
  const nm=document.createElement('span');
  const n=document.createElement('span'); n.className='n';
  b.append(nm,n);
  b.addEventListener('click',()=>document.getElementById('cat-'+ci).scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'}));
  nav.appendChild(b); navNames.push(nm);

  const sec=document.createElement('section');
  sec.className='cat'; sec.id='cat-'+ci;
  const h=document.createElement('h2');
  h.innerHTML='<span class="tick"></span>';
  const hn=document.createElement('span');
  let pri=null;
  if(cat.pri){
    pri=document.createElement('span');
    pri.className='pri '+cat.pri; pri.textContent=cat.pri;
  }
  const cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent=cat.items.length;
  const badge=document.createElement('span'); badge.className='selbadge';
  h.append(hn);
  if(pri)h.append(pri);
  h.append(cnt,badge);
  const grid=document.createElement('div'); grid.className='grid';
  cat.items.forEach((it,ii)=>{
    const btn=document.createElement('button');
    btn.type='button'; btn.className='chip'; btn.dataset.k=ci+':'+ii;
    btn.setAttribute('aria-pressed','false');
    const en=document.createElement('span'); en.className='en'; en.textContent=it[0];
    const sub=document.createElement('span'); sub.className='sub';
    btn.append(en,sub); grid.appendChild(btn);
    subs.push({el:sub,it});
  });
  sec.append(h,grid); main.appendChild(sec);
  secNames.push(hn); secBadges.push(badge); priEls.push(pri);
});

/* language switching */
function applyLang(){
  const t=I18N[lang];
  document.documentElement.lang=t.htmlLang;
  document.title=t.title;
  $('#pageTitle').textContent=t.pageTitle;
  document.body.classList.toggle('lang-en',lang==='en');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false'));
  document.querySelectorAll('#outlang button').forEach(b=>{
    b.setAttribute('aria-pressed',b.dataset.out===outLang?'true':'false');
    b.textContent=b.dataset.out==='zh'?t.outZh:b.dataset.out==='bi'?t.outBi:t.outEn;
  });
  $('#outlang').title=t.outTitle;
  $('#metaLine').innerHTML=`prompts.md · ${DATA.length} ${t.cats} · <b>${total}</b> ${t.items}`;
  $('#footerText').textContent=t.footer;
  out.placeholder=t.placeholder;
  out.setAttribute('aria-label',t.placeholder);
  $('#btnRandom .lbl').textContent=t.random; $('#btnRandom').title=t.randomTitle;
  $('#btnCopy .lbl').textContent=t.copy;     $('#btnCopy').title=t.copyTitle;
  $('#btnClear .lbl').textContent=t.clear;   $('#btnClear').title=t.clearTitle;
  $('#btnNeg .lbl').textContent=t.neg;       $('#btnNeg').title=t.negTitle;
  $('#btnNegReset .lbl').textContent=t.negReset;
  [['#btnCover','cover'],['#btnAnime','anime'],['#btnPhoto','photo']].forEach(([sel,id])=>{
    $(sel+' .lbl').textContent=t.presets[id][0]; $(sel).title=t.presets[id][1];
  });
  groupEls.forEach(el=>el.textContent=GROUPS[+el.dataset.g][lang]);
  priEls.forEach((el,ci)=>{if(el)el.title=DATA[ci].pri+' · '+t.priTips[DATA[ci].pri];});
  navNames.forEach((el,ci)=>el.textContent=dispName(DATA[ci]));
  secNames.forEach((el,ci)=>el.textContent=dispName(DATA[ci]));
  subs.forEach(({el,it})=>el.textContent=subText(it));
  measure();
  sync();
}
document.querySelectorAll('.lang button').forEach(b=>{
  b.addEventListener('click',()=>{
    lang=b.dataset.lang;
    try{localStorage.setItem(LANG_KEY,lang);}catch(e){}
    clearTimeout(copyTimer);
    btnCopy.classList.remove('ok');
    applyLang();
  });
});

/* toggle chips (event delegation) */
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(!chip) return;
  const k=chip.dataset.k;
  selected.has(k)?selected.delete(k):selected.add(k);
  sync();
});

function currentText(){
  const parts=[];
  DATA.forEach((cat,ci)=>cat.items.forEach((it,ii)=>{
    if(selected.has(ci+':'+ii)) parts.push(tokenText(it));
  }));
  return parts.join(', ');
}

function sync(){
  out.value=currentText();
  out.scrollTop=out.scrollHeight;
  const per=new Array(DATA.length).fill(0);
  selected.forEach(k=>per[+k.split(':')[0]]++);
  document.querySelectorAll('.chip').forEach(ch=>{
    ch.setAttribute('aria-pressed',selected.has(ch.dataset.k)?'true':'false');
  });
  nav.querySelectorAll('.navlink').forEach((b,ci)=>{
    b.classList.toggle('has-sel',per[ci]>0);
    b.querySelector('.n').textContent=per[ci]>0?' '+per[ci]:'';
  });
  secBadges.forEach((el,ci)=>el.textContent=I18N[lang].badge(per[ci]));
  document.querySelectorAll('.cat').forEach((sec,ci)=>{
    sec.classList.toggle('has-sel',per[ci]>0);
  });
  $('#countText').innerHTML=I18N[lang].selected(selected.size);
}

/* random: one per category */
$('#btnRandom').addEventListener('click',()=>{
  selected.clear();
  DATA.forEach((cat,ci)=>{
    selected.add(ci+':'+Math.floor(Math.random()*cat.items.length));
  });
  sync();
  window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});
});

/* clear all */
$('#btnClear').addEventListener('click',()=>{selected.clear();sync();});

/* copy (shared by main output and negative prompt) */
async function copyText(t){
  if(!t)return false;
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(_){
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(__){}
    ta.remove();
    return ok;
  }
}
const btnCopy=$('#btnCopy');
const copyLblEl=btnCopy.querySelector('.lbl');
let copyTimer;
btnCopy.addEventListener('click',async()=>{
  const t=out.value;
  const ok=await copyText(t);
  copyLblEl.textContent=t?(ok?I18N[lang].copied:I18N[lang].copyFail):I18N[lang].empty;
  btnCopy.classList.toggle('ok',ok);
  clearTimeout(copyTimer);
  copyTimer=setTimeout(()=>{copyLblEl.textContent=I18N[lang].copy;btnCopy.classList.remove('ok');},1500);
});

/* prompt output language switch (independent of UI language) */
document.querySelectorAll('#outlang button').forEach(b=>{
  b.addEventListener('click',()=>{
    outLang=b.dataset.out;
    try{localStorage.setItem(OUT_KEY,outLang);}catch(e){}
    document.querySelectorAll('#outlang button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.out===outLang?'true':'false'));
    sync();
  });
});

/* negative prompt panel */
const negrow=$('#negrow'),negout=$('#negout'),btnNeg=$('#btnNeg'),btnNegCopy=$('#btnNegCopy');
let negTimer;
try{negout.value=localStorage.getItem(NEG_KEY)||NEG_DEFAULT;}catch(e){negout.value=NEG_DEFAULT;}
btnNeg.addEventListener('click',()=>{
  negrow.hidden=!negrow.hidden;
  btnNeg.setAttribute('aria-pressed',negrow.hidden?'false':'true');
  measure();
});
negout.addEventListener('input',()=>{try{localStorage.setItem(NEG_KEY,negout.value);}catch(e){}});
$('#btnNegReset').addEventListener('click',()=>{
  negout.value=NEG_DEFAULT;
  try{localStorage.removeItem(NEG_KEY);}catch(e){}
});
btnNegCopy.addEventListener('click',async()=>{
  const ok=await copyText(negout.value);
  const lbl=btnNegCopy.querySelector('.lbl');
  lbl.textContent=ok?I18N[lang].copied:I18N[lang].copyFail;
  btnNegCopy.classList.toggle('ok',ok);
  clearTimeout(negTimer);
  negTimer=setTimeout(()=>{lbl.textContent=I18N[lang].copy;btnNegCopy.classList.remove('ok');},1500);
});

/* one-click presets (additive on top of the current selection) */
const PRESETS={
  cover:[['Quality & Technical',['photorealistic','masterpiece','best quality','8k','ultra detailed','sharp focus','skin texture','professional photography']],
         ['Lighting & Atmosphere',['cinematic lighting','rim light','erotic atmosphere']],
         ['Composition & Camera',['low angle','looking at viewer','shallow depth of field','portrait']],
         ['Color & Tone',['cinematic color grade']],
         ['Eyes',['seductive gaze']]],
  anime:[['Quality & Technical',['masterpiece','best quality','ultra detailed']],
         ['Art Style & Medium',['anime style','vibrant colors']],
         ['Eyes',['large eyes','detailed iris']],
         ['Lighting & Atmosphere',['soft lighting']],
         ['Composition & Camera',['portrait','centered composition']]],
  photo:[['Quality & Technical',['raw photo','photorealistic','professional photography','studio lighting','8k','skin texture','pore details']],
         ['Lighting & Atmosphere',['soft lighting','high key lighting']],
         ['Composition & Camera',['portrait','85mm lens','shallow depth of field']],
         ['Color & Tone',['warm tones','color grading']]],
};
[['btnCover','cover'],['btnAnime','anime'],['btnPhoto','photo']].forEach(([bid,id])=>{
  $('#'+bid).addEventListener('click',()=>{
    (PRESETS[id]||[]).forEach(([catEn,kws])=>{
      const ci=DATA.findIndex(c=>c.en===catEn);
      if(ci<0)return;
      kws.forEach(kw=>{
        const ii=DATA[ci].items.findIndex(it=>it[0]===kw);
        if(ii>=0)selected.add(ci+':'+ii);
      });
    });
    sync();
    window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});
  });
});

/* keep scroll offset in sync with sticky bar height */
function measure(){
  document.documentElement.style.setProperty('--stickyH',$('#stickyzone').offsetHeight+'px');
}
measure();
addEventListener('resize',measure);
applyLang();
</script>
</body>
</html>
